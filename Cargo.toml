[workspace]
resolver = "2"
members = ["crates/voicemixer-core", "crates/voicemixer"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1

# DSP code is unusably slow without optimisation, even while developing.
[profile.dev.package.voicemixer-core]
opt-level = 2
