[package]
name = "voicemixer"
description = "Virtual audio mixer for Linux: 5 inputs, 5 outputs, routing, effects, recorder, VBAN, MIDI and remote control"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.deb]
maintainer = "notth4tcold <notth4tcold@gmail.com>"
copyright = "2026, notth4tcold"
license-file = ["../../LICENSE", "0"]
section = "sound"
priority = "optional"
depends = "$auto, pipewire"
recommends = "wireplumber"
suggests = "lame"
extended-description = """\
Virtual mixing console for Linux and PipeWire: three hardware and two virtual \
inputs, three hardware and two virtual outputs, per-strip compressor, gate, EQ \
and limiter, parametric bus EQ, tape recorder, VBAN network audio, MIDI and \
remote control."""
assets = [
    ["target/release/voicemixer", "usr/bin/", "755"],
    ["../../packaging/voicemixer.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/voicemixer.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/icons/voicemixer.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../README.md", "usr/share/doc/voicemixer/README.md", "644"],
]

[features]
default = ["midi"]
midi = ["dep:midir"]

[dependencies]
voicemixer-core = { path = "../voicemixer-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
eframe = "0.32"
env_logger = "0.11"
hound = "3.5"
log = "0.4"
midir = { version = "0.10", optional = true }
parking_lot = "0.12"
rtrb = "0.3"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
# Same winit as eframe, to own the event loop across window re-opens (tray).
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Tray icon over D-Bus (StatusNotifierItem); pure Rust, no GTK.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libspa-sys = "0.10"
# v0_3_49 enables Buffer::requested; PipeWire 1.0+ is required anyway.
pipewire = { version = "0.10", features = ["v0_3_49"] }
