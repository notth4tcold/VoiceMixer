name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Build
        run: |
          set -o pipefail
          cargo build --workspace --locked --message-format=short 2>&1 | tee build.log
      # Build logs need repository admin rights to download; annotations are public.
      - name: Report build errors as annotations
        if: failure()
        run: |
          { grep -E '(error|warning)(\[E[0-9]+\])?:' build.log | head -30; tail -n 25 build.log; } | sed 's/^/::error::/'
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
