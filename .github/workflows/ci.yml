name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Build
        run: |
          set -o pipefail
          export CARGO_TERM_COLOR=never
          cargo build --workspace --locked --message-format=short 2>&1 | tee build.log
      - name: Report build errors as annotations
        if: failure()
        run: |
          sed 's/\[[0-9;]*m//g' build.log > clean.log
          { grep -E "(error|warning)(\[E[0-9]+\])?:" clean.log | head -30; tail -n 25 clean.log; } | sed 's/^/::error::/'
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
