name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Build
        run: |
          set -o pipefail
          cargo build --workspace --locked --message-format=short 2>&1 | tee build.log
      - run: cargo test --workspace --locked
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings 2>&1 | tee clippy.log
      # Build logs need repository admin rights to download; annotations are public.
      - name: Report errors as annotations
        if: failure()
        run: |
          # One multi-line annotation (GitHub shows at most 10 per step).
          for f in clippy.log build.log; do
            [ -f "$f" ] || continue
            msg=$(grep -E -A3 '^(error|warning)|: (error|warning)' "$f" | grep -v '^\s*Compiling' | head -60 \
              | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$msg" ] && echo "::error title=$f::$msg"
          done
