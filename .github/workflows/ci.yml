name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest Ubuntu: also runs fmt and clippy.
          - name: ubuntu-24.04
            runner: ubuntu-24.04
            lint: true
          # Rolling release with the newest PipeWire.
          - name: arch
            runner: ubuntu-24.04
            container: archlinux:base-devel
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - name: System dependencies (Arch)
        if: matrix.container
        run: pacman -Syu --noconfirm --needed git rust clang pkgconf pipewire alsa-lib libxkbcommon libglvnd
      - uses: actions/checkout@v4
      - name: System dependencies (Ubuntu)
        if: ${{ !matrix.container }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.container }}
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.container }}
      - name: Versions
        run: |
          rustc --version
          pkg-config --modversion libpipewire-0.3
      - if: matrix.lint
        run: cargo fmt --all --check
      - name: Build
        run: |
          set -o pipefail
          cargo build --workspace --locked --message-format=short 2>&1 | tee build.log
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log
      - name: Clippy
        if: matrix.lint
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings 2>&1 | tee clippy.log
      # Build logs need repository admin rights to download; annotations are public.
      - name: Report errors as annotations
        if: failure()
        run: |
          # One multi-line annotation per log (GitHub shows at most 10 per step).
          for f in build.log test.log clippy.log; do
            [ -f "$f" ] || continue
            msg=$( { grep -E -A6 '^(error|warning)|: (error|warning)|panicked|FAILED' "$f" | grep -v '^\s*Compiling' | head -60; tail -n 12 "$f"; } \
              | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$msg" ] && echo "::error title=${{ matrix.name }} $f::$msg"
          done
          true

  arch-package:
    name: arch package (makepkg)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust clang pkgconf pipewire alsa-lib libxkbcommon libglvnd
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if ! bash -x packaging/arch/ci-build.sh "$ver" dist > pkg.log 2>&1; then
            cat pkg.log
            msg=$(tail -n 40 pkg.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/
/%0A/g')
            echo "::error title=arch package::$msg"
            exit 1
          fi
