name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  ubuntu:
    # Oldest Ubuntu whose PipeWire (1.0) the pipewire crate builds against; the
    # binaries therefore need Ubuntu 24.04 / Debian 13 or newer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches crate version
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$crate" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $crate"; exit 1; }
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p voicemixer
      - run: strip target/release/voicemixer
      - name: Debian package
        run: |
          cargo install cargo-deb --locked
          mkdir -p dist
          cargo deb -p voicemixer --no-build --no-strip --output dist/voicemixer_amd64.deb
      - name: Tarball
        run: |
          # Version-less asset names keep .../releases/latest/download/<file> links stable.
          mkdir -p dist/voicemixer
          cp target/release/voicemixer README.md LICENSE packaging/voicemixer.desktop dist/voicemixer/
          tar -C dist -czf dist/voicemixer-linux-x86_64.tar.gz voicemixer
          rm -r dist/voicemixer
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: dist/*

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed git rust clang pkgconf pipewire alsa-lib libxkbcommon libglvnd
      - uses: actions/checkout@v4
      - name: Build package with makepkg
        run: |
          ver="${GITHUB_REF_NAME#v}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          mkdir /build
          cp packaging/arch/PKGBUILD /build/
          git archive --prefix="VoiceMixer-$ver/" -o "/build/voicemixer-$ver.tar.gz" HEAD
          sed -i "s/^pkgver=.*/pkgver=$ver/; s|^source=.*|source=(\"voicemixer-$ver.tar.gz\")|" /build/PKGBUILD
          chown -R builder /build
          cd /build && sudo -u builder makepkg --noconfirm
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp /build/voicemixer-*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/voicemixer-x86_64.pkg.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*

  publish:
    needs: [ubuntu, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Requires PipeWire (default on current Ubuntu, Fedora, Arch and Debian 12+).

            **Ubuntu / Debian**
            ```sh
            sudo apt install ./voicemixer_amd64.deb
            ```

            **Arch Linux**
            ```sh
            sudo pacman -U voicemixer-x86_64.pkg.tar.zst
            ```

            **Any distribution** (x86_64)
            ```sh
            tar xzf voicemixer-linux-x86_64.tar.gz
            ./voicemixer/voicemixer
            ```
          files: dist/*
